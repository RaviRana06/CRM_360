[alembic]
script_location = alembic
prepend_sys_path = .
version_locations = %(here)s/alembic/versions

sqlalchemy.url = mssql+pyodbc://sa:YourPassword123!@localhost:1433/crm360_db?driver=ODBC+Driver+17+for+SQL+Server

[post_write_hooks]

[logging]
default_handler = console

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
